name = "reend-gh-status"
main = "src/server/worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# satori は harfbuzzjs をそのまま import する。本家は hb.wasm を自分で探して
# 読む（node は fs、ブラウザは fetch）が workerd ではどちらも使えないため、
# 同梱の wasm を渡す差し替えモジュールへ向ける。
[alias]
harfbuzzjs = "./src/server/svg/harfbuzzjs.ts"

[assets]
directory = "dist"
binding = "ASSETS"
# SPA クライアントルーティング用: 直アクセス（ナビゲーション要求）で
# 静的アセットに該当しない場合は index.html を返す。
not_found_handling = "single-page-application"
# リストに挙げたパスだけ Worker を先に通す。
# /api/* はダッシュボードのデータ API、/card/* は README 埋め込み用の SVG。
run_worker_first = ["/api/*", "/card/*"]

[vars]
# 表示対象のログイン名。固定運用（他人のアカウントは引けない）。
GITHUB_USERNAME = "ebina4yaka"
# 非公開リポジトリのコントリビューションを合計に含めるか。
INCLUDE_PRIVATE = "true"

# Secrets（wrangler secret put で設定する）:
#   wrangler secret put GITHUB_TOKEN   # GitHub PAT（read:user）
